version: '3.8'

services:
  db:
    image: postgres:15
    container_name: photographer_site_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: photographer_site
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts:/docker-entrypoint-initdb.d

  minio:
    image: minio/minio
    container_name: photographer_site_minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: AKIASMYOX2LPGLZLRGER
      MINIO_ROOT_PASSWORD: py9eemGX4Hp8QiA0/A/9RDTA/5Vfk6Q4BBORQOqX
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c " /usr/bin/mc alias set myminio http://minio:9000 AKIASMYOX2LPGLZLRGER py9eemGX4Hp8QiA0/A/9RDTA/5Vfk6Q4BBORQOqX; /usr/bin/mc mb myminio/amzn-foto-anon-local; /usr/bin/mc anonymous set public myminio/amzn-foto-anon-local; exit 0; "

volumes:
  postgres_data:
  minio_data:

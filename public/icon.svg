<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800&amp;display=swap');
    .text { 
      font-family: 'Montserrat', sans-serif; 
      font-weight: 800; 
      text-anchor: middle; 
      dominant-baseline: middle;
    }
    @media (prefers-color-scheme: light) {
      .bg { fill: #000000; }
      .fg { fill: #FFFFFF; }
    }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #FFFFFF; }
      .fg { fill: #000000; }
    }
  </style>
  <rect class="bg" width="180" height="180" rx="44" />
  <text x="90" y="64" class="fg text" font-size="85">S</text>
  <text x="90" y="116" class="fg text" font-size="85">S</text>
</svg>